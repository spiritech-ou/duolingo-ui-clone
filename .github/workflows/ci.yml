name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pull request runs cancel older ones. Runs on main are never cancelled,
# because they may be deploying to production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run test
      - run: npm run test:storybook
      - run: npm run build
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy
    # GitHub Pages deployment of the built app: main pushes only, after the check job.
    # Pull requests do not deploy (no previews). Storybook is hosted by Chromatic.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    # A called workflow cannot hold more than its caller grants: these are the
    # permissions of its deploy job (the top level of this file stays read only).
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  chromatic:
    name: chromatic
    # Same-repository events only (forks have no secrets), after the check job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory: Chromatic reports component errors for stories whose play functions need the Vitest
    # browser runner (window size, media emulation). The check job already runs every story there and
    # gates the deploy, so a Chromatic error must not turn the whole run red. The snapshots and the
    # Storybook URL are still published. Remove this once those stories stop asserting the viewport.
    continue-on-error: true
    steps:
      - name: Check for Chromatic token
        id: token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: CHROMATIC_PROJECT_TOKEN is not set, so the Chromatic visual review did not run (see README, Enable Chromatic)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Chromatic finds baselines through git history, so it needs the full clone.
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      # The CLI is called directly because the action has no input for --allow-console-errors, which
      # these Storybook stories need: some assert the window size or media emulation that only the
      # Vitest browser runner provides (the check job runs every story there and gates this job), so
      # they report errors in Chromatic's own browser. Chromatic is used for visual review only.
      # exit-zero-on-changes keeps the job green; the Chromatic status check on the pull request
      # carries the review state. Merged changes on main become the accepted baseline.
      - name: Publish to Chromatic
        if: steps.token.outputs.present == 'true'
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: npx --yes chromatic@18.13.6 --build-script-name build-storybook --exit-zero-on-changes --auto-accept-changes main --allow-console-errors
