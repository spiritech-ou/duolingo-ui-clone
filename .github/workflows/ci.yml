name: CI

on:
  push:
    branches: [main]
  pull_request:

# Newer pull request runs cancel older ones. Runs on main are never cancelled,
# because they may be deploying to production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run test
      - run: npm run test:storybook
      - run: npm run build
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy
    # Vercel preview (same-repository pull requests) and production (main).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  storybook:
    name: storybook
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4

  chromatic:
    name: chromatic
    # Same-repository events only (forks have no secrets), after the check job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for Chromatic token
        id: token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: CHROMATIC_PROJECT_TOKEN is not set, so the Chromatic visual review did not run (see README, Enable Chromatic)." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Chromatic finds baselines through git history, so it needs the full clone.
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.token.outputs.present == 'true'
      - uses: chromaui/action@v11
        if: steps.token.outputs.present == 'true'
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          # The job stays green; the Chromatic status check on the pull request
          # carries the review state until a reviewer accepts the changes.
          exitZeroOnChanges: true
          # Merged changes were reviewed on the pull request, so builds on main
          # become the accepted baseline. Pull requests are never auto accepted.
          autoAcceptChanges: main
          # Some stories assert the browser window size or media emulation, which only the
          # Vitest browser runner provides (the check job runs all stories there and gates
          # the deploy). Chromatic renders them in its own browser, so those assertions
          # report errors there. Chromatic is used for visual review, not for interaction tests.
          allowConsoleErrors: true
