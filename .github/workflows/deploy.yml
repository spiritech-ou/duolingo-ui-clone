name: Deploy

# Reusable workflow, called by the `deploy` job of ci.yml after the `check` job
# passed, so nothing is deployed from a red tree and the checks are not
# duplicated. A push to main builds the app and publishes it to GitHub Pages at
# https://spiritech-ou.github.io/duolingo-ui-clone/. Pull requests do not deploy
# (no preview, see README). No secret is used: Pages authenticates the deploy
# job with the job's OIDC token.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build
    # Same guard as the calling job, so the workflow stays safe if called from elsewhere.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages reads the Pages site settings.
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      # The script sets VITE_USE_MOCKS=true (the app has no backend) and
      # BASE_PATH=/duolingo-ui-clone/ (project site sub path), and writes
      # dist/404.html (SPA deep link fallback: Pages has no rewrites).
      - name: Build for GitHub Pages
        run: npm run build:pages
      # Without it Pages runs Jekyll, which drops files and folders starting with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # A running deployment is never cancelled halfway by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
